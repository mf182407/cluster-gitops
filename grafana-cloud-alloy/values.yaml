alloy:
  clustering:
    enabled: true
    name: alloy
  configMap:
    create: false
  extraEnv:
    - name: NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: CLUSTER_NAME
      value: microk8s
    - name: GCLOUD_RW_API_KEY
      valueFrom:
        secretKeyRef:
          key: password
          name: alloy-remote-cfg-grafana-cloud-k8s-monitoring
  extraPorts:
    - appProtocol: grpc
      name: otlp-grpc
      port: 4317
      protocol: TCP
      targetPort: 4317
    - appProtocol: http
      name: otlp-http
      port: 4318
      protocol: TCP
      targetPort: 4318
  mounts:
    dockercontainers: true
    extra:
      - mountPath: /var/lib/alloy
        name: alloy-storage
        readOnly: false
      - mountPath: /sys/fs/cgroup
        name: cgroup
    varlog: true
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: true
    capabilities:
      add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - FSETID
        - KILL
        - SETGID
        - SETUID
        - SETPCAP
        - NET_BIND_SERVICE
        - NET_RAW
        - SYS_CHROOT
        - MKNOD
        - AUDIT_WRITE
        - SETFCAP
      drop:
        - ALL
    privileged: true
    runAsGroup: 0
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
  storagePath: /var/lib/alloy
controller:
  dnsPolicy: ClusterFirstWithHostNet
  hostNetwork: true
  hostPID: true
  nodeSelector:
    kubernetes.io/os: linux
  podAnnotations:
    k8s.grafana.com/logs.job: integrations/alloy
  tolerations:
    - effect: NoSchedule
      operator: Exists
  type: daemonset
  volumes:
    extra:
      - hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
        name: alloy-storage
      - hostPath:
          path: /sys/fs/cgroup
          type: Directory
        name: cgroup
crds:
  create: false
nameOverride: alloy
