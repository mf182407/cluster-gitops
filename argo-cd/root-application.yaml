apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mf182407/cluster-gitops.git
    targetRevision: main
    path: argo-cd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
